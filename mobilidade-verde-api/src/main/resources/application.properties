spring.application.name=mobilidade-verde-api

# A porta vem da variavel PORT quando a aplicacao roda no servidor
# de deploy. Localmente, cai no 8080.
server.port=${PORT:8080}

# Mensagens de erro em JSON incluem a descricao do problema.
server.error.include-message=always
